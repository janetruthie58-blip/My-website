<!DOCTYPE html>
<html lang="en">

<head>

    <title>Dear Diary</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div>
        <h1>Dear Diary</h1>
        <p>Welcome to your personal Diary.</p>
        <h2>Write a Diary Entry</h2>


        <form id="diaryForm">

            <label>Title</label><br>
            <input type="text" id="entryTitle" placeholder="Enter Entry title" required><br><br>

            <label>Diary Entry</label><br><br>
            <textarea id="entryText" placeholder="Write your thoughts here..." rows="10" cols="40" required></textarea><br><br>

            <button type="submit">Save Entry</button>

        </form>

        <br>

        <a href="index.html">Home</a>

        <br><br>

        <button onclick="viewEntry()">View My Entries</button>
        <br><br>

        <button onclick="logout()">Logout</button>
    </div>

    <script src="scripts.js"></script>

</body>

</html>
