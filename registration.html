<!DOCTYPE html>
<html>

<head>
    <title>registration</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="registration-page">

    <nav class="navbar">
        <div class="logo">Dear Diary</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="registration.html">Register</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="entries.html"> My Entries</a>
            <a href="profiles.html"> Profiles</a>
            <a href="#" onclick="logout()">Logout</a>

        </div>
    </nav>

    <div class="registration-card">

        <h1>Register</h1>

        <form class="registration-form">

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" pattern="[A-Za-z ]+" title="use letters and spaces only" required>
            <br><br>


            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <br><br>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="create a password" minlength="8" required>
            <br><br>

            <label for="confirmPassword">Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            <br><br>

            <button type="submit">Register</button>

        </form>

        <p>already have an account?</p>
        <a href="login.html">login</a>
    </div>
    <script src="scripts.js"></script>


</body>

</html>
